[project]
name = "ultrademo"
version = "0.1.0"
description = "Live AI product experts that operate real software on a shared screen"
requires-python = ">=3.12,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/protocol", "services/api", "services/operator", "services/session-agent"]

[tool.uv.sources]
ultrademo-protocol = { workspace = true }

[dependency-groups]
dev = [
  "pyjwt==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["packages/protocol/tests", "services/api/tests", "services/operator/tests", "services/session-agent/tests"]
