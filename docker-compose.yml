# Local stack: everything a demo needs except the browser player UI.
#   cp .env.example .env   # add ANTHROPIC_API_KEY, DEEPGRAM_API_KEY, ELEVEN_API_KEY
#   docker compose up --build
#   docker compose exec api python -m ultrademo_api.bootstrap examples/acme.json
name: ultrademo

x-internal: &internal
  ULTRADEMO_INTERNAL_TOKEN: ${ULTRADEMO_INTERNAL_TOKEN:?set it in .env}

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ultrademo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ultrademo"]
      interval: 2s
      retries: 30

  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ["--dev", "--bind", "0.0.0.0"]
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

  api:
    build: {context: ., dockerfile: infra/docker/python-service.Dockerfile, args: {PACKAGE: ultrademo-api}}
    command: ["sh", "-c", "python -m ultrademo_api.migrate && uvicorn ultrademo_api.app:create_app --factory --host 0.0.0.0 --port 8000"]
    environment:
      <<: *internal
      ULTRADEMO_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ultrademo
      ULTRADEMO_PUBLIC_BASE_URL: http://localhost:3000
      # The browser connects from the host, so it gets the host-published address.
      ULTRADEMO_LIVEKIT_URL: ws://localhost:7880
      ULTRADEMO_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      ULTRADEMO_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}

  operator:
    build: {context: ., dockerfile: infra/docker/operator.Dockerfile}
    environment:
      ULTRADEMO_OPERATOR_INTERNAL_TOKEN: ${ULTRADEMO_INTERNAL_TOKEN}
      ULTRADEMO_OPERATOR_LIVEKIT_URL: ${LIVEKIT_URL}
      ULTRADEMO_OPERATOR_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      ULTRADEMO_OPERATOR_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ULTRADEMO_OPERATOR_MAX_SANDBOXES: "4"
    shm_size: 1gb
    ports: ["8100:8100"]

  agent:
    build: {context: ., dockerfile: infra/docker/agent.Dockerfile}
    environment:
      ULTRADEMO_AGENT_INTERNAL_TOKEN: ${ULTRADEMO_INTERNAL_TOKEN}
      ULTRADEMO_AGENT_API_URL: http://api:8000
      ULTRADEMO_AGENT_OPERATOR_URL: http://operator:8100
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set it in .env}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?set it in .env}
      ELEVEN_API_KEY: ${ELEVEN_API_KEY:?set it in .env}
    depends_on: [api, operator, livekit]

  # A small fake CRM the agent can demo end to end without customer credentials.
  sample-product:
    image: python:3.13-slim
    command: ["python", "-m", "http.server", "8080", "--directory", "/site"]
    volumes: ["./examples/sample-product:/site:ro"]
    ports: ["8080:8080"]

volumes:
  pgdata:
