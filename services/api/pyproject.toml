[project]
name = "ultrademo-api"
version = "0.1.0"
description = "Control plane: orgs, API keys, launch configs, context links, sessions, Client API v1"
requires-python = ">=3.12"
dependencies = [
  "ultrademo-protocol",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic-settings==2.15.0",
  "asyncpg==0.31.0",
  "argon2-cffi==25.1.0",
  "livekit-api==1.2.1",
  "structlog==26.1.0",
]

[dependency-groups]
dev = ["httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultrademo_api"]
