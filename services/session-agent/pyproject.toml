[project]
name = "ultrademo-agent"
version = "0.1.0"
description = "Voice session agent: LiveKit Agents pipeline with a Claude brain that operates the product"
requires-python = ">=3.12,<3.15"
dependencies = [
  "ultrademo-protocol",
  "anthropic==1.8.0",
  "livekit-agents==1.8.2",
  "livekit-plugins-deepgram==1.8.2",
  "livekit-plugins-elevenlabs==1.8.2",
  "livekit-plugins-silero==1.8.2",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "structlog==26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultrademo_agent"]
