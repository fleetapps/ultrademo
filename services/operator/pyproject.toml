[project]
name = "ultrademo-operator"
version = "0.1.0"
description = "Browser sandbox: drives the customer's product with Playwright and streams the screen to LiveKit"
requires-python = ">=3.12"
dependencies = [
  "ultrademo-protocol",
  "playwright==1.63.0",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic-settings==2.15.0",
  "livekit==1.1.18",
  "livekit-api==1.2.1",
  "pillow==12.3.0",
  "structlog==26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultrademo_operator"]
