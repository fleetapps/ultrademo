[project]
name = "ultrademo-protocol"
version = "0.1.0"
description = "Shared wire schemas: realtime envelope, agent tool inputs, policy classes"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultrademo_protocol"]
